# version: "3.8"

services:
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
    networks:
      - backend
    restart: unless-stopped

  auth-service:
    build:
      context: ./AuthenticationService
      dockerfile: dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - user-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - USER_SERVICE_URL=http://user-service:8081
      - SERVICE_SECRET=service-secret-key
    networks:
      - backend
    restart: unless-stopped

  user-service:
    build:
      context: ./UserServices
      dockerfile: dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=userdb
      - PORT=8081
      - JWT_SECRET=supersecretkey
      - SERVICE_SECRET=service-secret-key
    networks:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  postgres:
    image: timescale/timescaledb:2.14.2-pg16-oss
    container_name: trading_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/timescale.sql:/docker-entrypoint-initdb.d/02_timescale.sql:ro
    networks:
      - backend
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]

  market-data-service:
    build:
      context: ./market-data-service
      dockerfile: Dockerfile
    container_name: market-data-service
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/trading
      - DEFAULT_TF_MIN=5
      - MAX_LIMIT=5000
      - WS_DEFAULT_STEP_SECONDS=15
      - WS_MAX_STEP_SECONDS=60
      - WS_MIN_STEP_SECONDS=1
    networks:
      - backend
    restart: unless-stopped

  portfolio-service:
    build:
      context: ./portfolio-service
      dockerfile: Dockerfile
    container_name: portfolio-service
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - auth-service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/trading
      - AUTH_SERVICE_URL=http://auth-service:8080
      - INTERNAL_API_KEY=some-secret
      - JWT_SECRET=supersecretkey
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    networks:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: trading_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
  pgdata:

networks:
  backend:
    driver: bridge
