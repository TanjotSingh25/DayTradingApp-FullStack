# version: "3.8"

services:
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - auth-service
    networks:
      - backend
    restart: unless-stopped

  auth-service:
    build:
      context: ./AuthenticationService
      dockerfile: dockerfile
    container_name: auth-service
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
      - user-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - USER_SERVICE_URL=http://user-service:8081
      - SERVICE_SECRET=service-secret-key
    networks:
      - backend
    restart: unless-stopped

  user-service:
    build:
      context: ./UserServices
      dockerfile: dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=userdb
      - PORT=8081
      - JWT_SECRET=supersecretkey
      - SERVICE_SECRET=service-secret-key
    networks:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend

  postgres:
    image: timescale/timescaledb:2.14.2-pg16-oss
    container_name: trading_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - backend
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]

volumes:
  mongo_data:
  pgdata:

networks:
  backend:
    driver: bridge
